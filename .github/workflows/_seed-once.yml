name: One-time Ardisa Stage 0 seed regeneration

on:
  pull_request:
    types: [synchronize]
    paths:
      - bootstrap/compiler.ardisa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate deterministic Stage 0 from compiler source
        id: seed
        continue-on-error: true
        run: |
          source="$(cat bootstrap/compiler.ardisa)"
          cargo run -q --release -p ardisa -- run bootstrap/compiler.ardisa "$source" > bootstrap/stage0.aexe 2> bootstrap/seed.stderr
          status=$?
          {
            echo "seed_exit=$status"
            echo "seed_bytes=$(wc -c < bootstrap/stage0.aexe)"
            echo "seed_header=$(head -n 1 bootstrap/stage0.aexe || true)"
            echo "compiler_lines=$(wc -l < bootstrap/compiler.ardisa)"
          } | tee bootstrap/seed.summary
          cat bootstrap/seed.stderr
          test "$status" -eq 0
          grep -q '^ARDISA-EXEC-V1$' bootstrap/stage0.aexe
          test -s bootstrap/stage0.aexe
      - name: Commit seed or diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.seed.outcome }}" = "success" ]; then
            git add bootstrap/stage0.aexe
            git diff --cached --quiet || git commit -m "build: regenerate native Stage 0 seed"
          else
            git add bootstrap/seed.stderr bootstrap/seed.summary
            git diff --cached --quiet || git commit -m "ci: record Stage 0 seed regeneration failure"
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
