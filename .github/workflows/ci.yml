name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, feature/native-self-hosting]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ardisa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ardisa compile, tests, and native bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Compile and test
        run: cargo test --release --workspace --all-targets

      - name: Regenerate trusted Stage 0 through native bootstrap
        timeout-minutes: 15
        run: |
          chmod +x bootstrap/regenerate_stage0.sh bootstrap/verify_self_hosting.sh
          ./bootstrap/regenerate_stage0.sh

      - name: Validate trusted Stage 0 root artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("bootstrap/stage0.aexe")
          text = p.read_text()
          if not text.startswith("ARDISA-EXEC-V1\\n"):
              raise SystemExit("Stage 0 is not an ARDISA-EXEC-V1 artifact")
          if "FN|patch_instruction|" not in text:
              raise SystemExit("Stage 0 is not the direct-emission compiler")
          if "LABEL:" in text or "JumpIfFalse:$" in text:
              raise SystemExit("symbolic branch artifacts remain in Stage 0")
          PY

      - name: Enforce native compiler target contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("bootstrap/compiler.ardisa").read_text()
          forbidden = (
              "fn backend(",
              "symbolic",
              "LABEL:",
              "$L",
              "$W",
              "JumpIfFalse:$",
          )
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit("compiler-specific pseudo-IR remains: " + ", ".join(hits))
          PY

      - name: Host compiler exclusion guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("crates/aifocus-cli/src/main.rs").read_text()
          start = text.index("fn bootstrap_compile(")
          end = text.index("fn bootstrap_run(")
          section = text[start:end]
          forbidden = (
              "ardisa_core::parse",
              "ardisa_core::sema::check",
              "ardisa_core::ownership::infer",
              "ardisa_core::ir::lower",
              "ardisa_core::native::compile_program",
          )
          hits = [item for item in forbidden if item in section]
          if hits:
              raise SystemExit("Rust Stage-0 construction path detected: " + ", ".join(hits))
          PY

      - name: Verify staged self-hosting
        run: |
          test -s bootstrap/evidence/stage1.aexe
          test -s bootstrap/evidence/stage2.aexe
          test -s bootstrap/evidence/stage3.aexe
          cmp -s bootstrap/evidence/stage2.aexe bootstrap/evidence/stage3.aexe

      - name: Record Stage 0 provenance
        run: |
          sha256sum bootstrap/stage0.aexe | tee bootstrap/evidence/stage0.sha256
          sha256sum bootstrap/compiler.ardisa | tee bootstrap/evidence/compiler.ardisa.sha256

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-bootstrap-evidence
          path: |
            bootstrap/evidence/
            bootstrap/stage0.rebuilt.aexe
            bootstrap/stage0.aexe
          if-no-files-found: ignore

      - name: Commit regenerated trusted Stage 0
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/stage0.aexe
          if git diff --cached --quiet; then
            echo "Stage 0 seed unchanged"
          else
            git commit -m "build: regenerate trusted native Stage 0"
            git push origin HEAD:${{ github.ref_name }}
          fi
 bootstrap/stage0.aexe
          grep -q '^FN|patch_instruction|' bootstrap/stage0.aexe
