name: CI

on:
  push:
    branches: [main, feature/native-self-hosting]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ardisa-ci
  cancel-in-progress: true

jobs:
  verify:
    name: Ardisa compile, tests, and native bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Compile and test
        run: cargo test --release --workspace --all-targets

      - name: Validate native Stage 0 seed
        run: |
          test -s bootstrap/stage0.aexe
          grep -q '^ARDISA-EXEC-V1$' bootstrap/stage0.aexe

      - name: Verify native Stage 0 -> Stage 3 fixed point
        timeout-minutes: 15
        run: |
          chmod +x bootstrap/verify_self_hosting.sh
          ./bootstrap/verify_self_hosting.sh

      - name: Enforce native compiler target contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("bootstrap/compiler.ardisa").read_text()
          forbidden = ("fn backend(", "symbolic", "FN\\p", "LABEL:$")
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit("compiler-specific pseudo-IR remains: " + ", ".join(hits))
          PY

      - name: Host compiler exclusion guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("crates/aifocus-cli/src/main.rs").read_text()
          start = text.index("fn bootstrap_compile(")
          end = text.index("fn bootstrap_run(")
          section = text[start:end]
          forbidden = (
              "ardisa_core::parse",
              "ardisa_core::sema::check",
              "ardisa_core::ownership::infer",
              "ardisa_core::ir::lower",
              "ardisa_core::native::compile_program",
          )
          hits = [item for item in forbidden if item in section]
          if hits:
              raise SystemExit("Rust Stage-0 construction path detected: " + ", ".join(hits))
          PY

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-bootstrap-evidence
          path: bootstrap/evidence/
          if-no-files-found: ignore
