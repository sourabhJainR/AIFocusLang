name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, feature/native-self-hosting]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ardisa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ardisa compile, tests, and native bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Compile and test
        run: cargo test --release --workspace --all-targets

      - name: One-off trusted Stage 0 seed refresh
        run: |
          cargo run -q --release -p ardisa -- bootstrap host-seed bootstrap/compiler.ardisa bootstrap/stage0.aexe
          python3 - <<'PY'
          from pathlib import Path

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text()
          one_off = text.index("      - name: One-off trusted Stage 0 seed refresh")
          native = text.index("      - name: Regenerate trusted Stage 0 through native bootstrap", one_off)
          text = text[:one_off] + text[native:]
          text = text.replace("timeout-minutes: 2", "timeout-minutes: 15")
          ci.write_text(text)

          main = Path("crates/aifocus-cli/src/main.rs")
          text = main.read_text()
          command = text.index('            Some("host-seed") =>')
          verify = text.index('            Some("verify") =>', command)
          text = text[:command] + text[verify:]

          fn_start = text.index("#[rustfmt::skip]\nfn bootstrap_host_seed")
          fn_end = text.index("#[rustfmt::skip]\nfn bootstrap_compile_from_executable", fn_start)
          text = text[:fn_start] + text[fn_end:]
          main.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/stage0.aexe .github/workflows/ci.yml crates/aifocus-cli/src/main.rs
          git commit -m "build: refresh native Stage 0 seed"
          git push origin HEAD:feature/native-self-hosting

      - name: Regenerate trusted Stage 0 through native bootstrap
        timeout-minutes: 15
        run: |
          chmod +x bootstrap/regenerate_stage0.sh bootstrap/verify_self_hosting.sh
          ./bootstrap/regenerate_stage0.sh

      - name: Validate regenerated native Stage 0 seed
        run: |
          test -s bootstrap/stage0.aexe
          grep -q '^ARDISA-EXEC-V1$' bootstrap/stage0.aexe

      - name: Enforce native compiler target contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("bootstrap/compiler.ardisa").read_text()
          forbidden = ("fn backend(", "symbolic", "FN\\p")
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit("compiler-specific pseudo-IR remains: " + ", ".join(hits))
          PY

      - name: Host compiler exclusion guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("crates/aifocus-cli/src/main.rs").read_text()
          start = text.index("fn bootstrap_compile(")
          end = text.index("fn bootstrap_run(")
          section = text[start:end]
          forbidden = (
              "ardisa_core::parse",
              "ardisa_core::sema::check",
              "ardisa_core::ownership::infer",
              "ardisa_core::ir::lower",
              "ardisa_core::native::compile_program",
          )
          hits = [item for item in forbidden if item in section]
          if hits:
              raise SystemExit("Rust Stage-0 construction path detected: " + ", ".join(hits))
          PY

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-bootstrap-evidence
          path: |
            bootstrap/evidence/
            bootstrap/stage0.rebuilt.aexe
          if-no-files-found: ignore

      - name: Commit regenerated trusted Stage 0
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/stage0.aexe
          if git diff --cached --quiet; then
            echo "Stage 0 seed unchanged"
          else
            git commit -m "build: regenerate trusted native Stage 0"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
