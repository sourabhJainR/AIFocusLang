name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ardisa compile, tests, and native bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Compile and test
        run: cargo test --release --workspace --all-targets

      - name: Rebuild deterministic Stage 0 seed
        run: |
          cargo run -q --release -p ardisa -- bootstrap seed bootstrap/compiler.ardisa bootstrap/evidence-stage0.aexe
          grep -q '^ARDISA-EXEC-V1$' bootstrap/evidence-stage0.aexe
          test -s bootstrap/evidence-stage0.aexe
          cmp -s bootstrap/evidence-stage0.aexe bootstrap/stage0.aexe

      - name: Verify native Stage 0 -> Stage 3 fixed point
        run: |
          chmod +x bootstrap/verify_self_hosting.sh
          ./bootstrap/verify_self_hosting.sh

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-bootstrap-evidence
          path: bootstrap/evidence/
          if-no-files-found: ignore
