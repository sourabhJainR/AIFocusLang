name: one-off-stage0-repair

on:
  push:
    branches: [feature/native-self-hosting]

permissions:
  contents: write

jobs:
  repair:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild trusted Stage 0 once from compiler source
        run: cargo run -q --release -p ardisa -- bootstrap compile bootstrap/compiler.ardisa bootstrap/stage0.aexe
      - name: Verify and remove one-off workflow
        run: |
          test -s bootstrap/stage0.aexe
          grep -q '^ARDISA-EXEC-V1$' bootstrap/stage0.aexe
          rm .github/workflows/seed-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/stage0.aexe .github/workflows/seed-repair.yml
          git commit -m "build: refresh native Stage 0 seed"
          git push origin HEAD:feature/native-self-hosting
