name: Ardisa Bootstrap Seed

# The one-time root seed is generated from bootstrap/compiler.ardisa; runtime bootstrap never calls the host compiler.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build native Stage 0 seed from compiler.ardisa
        run: |
          cargo run -q -p ardisa -- bootstrap seed bootstrap/compiler.ardisa bootstrap/stage0.aexe
          grep -q '^ARDISA-EXEC-V1$' bootstrap/stage0.aexe
          test -s bootstrap/stage0.aexe
      - name: Commit deterministic Stage 0 seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/stage0.aexe
          if git diff --cached --quiet; then
            echo "Stage 0 seed already current"
          else
            git commit -m "build: add native Stage 0 bootstrap seed"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
