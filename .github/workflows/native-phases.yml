name: Ardisa Native Phases

concurrency:
  group: ardisa-native-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature/native-self-hosting]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Native phase contract tests
        run: cargo test -p ardisa-core compiler_engine
      - name: Native staged bootstrap
        run: |
          chmod +x bootstrap/regenerate_stage0.sh bootstrap/verify_self_hosting.sh
          ./bootstrap/regenerate_stage0.sh
          cp bootstrap/evidence/stage2.aexe evidence-stage2.aexe
          cp bootstrap/evidence/stage3.aexe evidence-stage3.aexe
          cargo run -q -p ardisa -- bootstrap verify bootstrap/stage0.aexe
          sha256sum bootstrap/stage0.aexe | tee bootstrap/evidence/stage0.native.sha256
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-native-phase-evidence
          path: evidence/
