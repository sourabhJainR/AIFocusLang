name: Ardisa Native Phases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Compiler-engine contract tests
        run: cargo test -p ardisa-core compiler_engine
      - name: Bootstrap host-fallback guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("crates/aifocus-cli/src/main.rs").read_text()
          start = text.index("fn bootstrap_compile(")
          end = text.index("fn bootstrap_run(")
          bootstrap = text[start:end]
          forbidden = ("compile_source", "crate::parse", "ardisa_core::parse", "sema::check", "ir::lower", "lower(&module)")
          hits = [item for item in forbidden if item in bootstrap]
          if hits:
              raise SystemExit("bootstrap host fallback detected: " + ", ".join(hits))
          PY
      - name: Native bootstrap chain
        run: |
          mkdir -p evidence
          cargo run -q -p ardisa -- bootstrap chain bootstrap/compiler.ardisa evidence
          cmp evidence/stage2.aexe evidence/stage3.aexe
          sha256sum evidence/stage2.aexe | tee evidence/stage2.aexe.sha256
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-native-phase-evidence
          path: evidence/
