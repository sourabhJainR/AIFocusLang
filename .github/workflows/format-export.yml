name: Export Rustfmt Result

on:
  push:
    branches:
      - feature/native-structured-concurrency

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all
      - name: Package formatted native runtime
        run: |
          mkdir -p format-export
          cp crates/aifocus-core/src/native.rs format-export/native.rs
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-native
          path: format-export/native.rs
